name: Build Godot Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Download CC0 Dirt Motorcycle
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --output assets/trials_bike.glb https://www.innerscene.com/api/library/dirt-motorcycle-0a9c8589/download
          python3 - <<'PY'
          import struct
          data = open("assets/trials_bike.glb", "rb").read()
          assert len(data) > 100000, "Downloaded file is too small"
          magic, version, size = struct.unpack_from("<4sII", data)
          assert magic == b"glTF" and version == 2 and size == len(data), "Invalid GLB file"
          print("Validated Dirt Motorcycle GLB:", len(data), "bytes")
          PY
      - name: Export Web
        run: |
          mkdir -p build/web
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
